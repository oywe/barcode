    margin:2px 0;
    border-radius:4px;
    font-size:12px;

  .exists { background:#c62828; }     /* 赤：存在 */
  .available { background:#2e7d32; }  /* 緑：未取得 */

/* ===== CORS対策プロキシ ===== */
const PROXY = "https://corsproxy.io/?";

/* ===== Scratchユーザーページ ===== */
function scratchUrl(name) {
  return "https://scratch.mit.edu/users/" + name + "/";
}

const list = document.getElementById("list");

/* ===== 判定 ===== */
async function checkAccount(name, el) {
  try {
    const res = await fetch(
      PROXY + encodeURIComponent(scratchUrl(name)),
      { method: "GET" }
    );

    if (res.status === 200) {
      el.className = "account exists";
    } else if (res.status === 404) {
      el.className = "account available";
    } else {
      el.className = "account checking";
    }
  } catch {
    el.className = "account checking";
  }
}

/* ===== 実行（レート制限対策あり） ===== */
(async () => {
  for (const name of accounts) {
    const div = document.createElement("div");
    div.textContent = name;
    div.className = "account checking";
    list.appendChild(div);

    checkAccount(name, div);

    // Scratch対策：アクセス間隔
    await new Promise(r => setTimeout(r, 300));
  }
})();
</script>
